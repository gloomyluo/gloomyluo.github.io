<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>中国国家级旅游度假区分布图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--primary:#1a3a5c;--accent:#2d6a9f;--bg:#f0f2f5;--card:#fff;--text:#333;--muted:#888;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* Header */
.header{background:linear-gradient(135deg,#1a3a5c,#2d6a9f,#1a3a5c);color:#fff;padding:24px 16px 20px;text-align:center}
.header h1{font-size:22px;font-weight:700;letter-spacing:1px}
.header p{font-size:12px;opacity:.75;margin-top:6px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px}
.stat-card{background:var(--card);border-radius:10px;padding:14px 8px;text-align:center;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.stat-num{font-size:26px;font-weight:700;color:var(--accent)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}

/* Map */
.map-section{padding:0 12px}
.map-wrapper{border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08)}
#map{width:100%;height:50vh;min-height:280px;max-height:520px;background:#dde8f0}

/* Leaflet controls mobile fix */
.legend{background:rgba(255,255,255,.95);border-radius:8px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;line-height:1.9;max-width:160px}
.legend h4{margin:0 0 2px;font-size:13px;color:#333;border-bottom:1px solid #eee;padding-bottom:3px}
.legend ul{list-style:none;margin:0;padding:0}
.legend li{cursor:pointer;padding:1px 4px;border-radius:4px;transition:background .15s}
.legend li:active{background:#e0ecf7}
.legend li span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle;border:1.5px solid #fff;box-shadow:0 0 2px rgba(0,0,0,.25)}
.info-box{background:rgba(255,255,255,.95);border-radius:8px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;line-height:1.6;max-width:200px}
.info-box h3{font-size:14px;color:var(--primary);margin-bottom:4px}
.search-wrap{background:rgba(255,255,255,.95);border-radius:8px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;gap:6px}
.search-wrap input{border:1px solid #ddd;border-radius:6px;padding:6px 10px;font-size:13px;width:180px;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .count{font-size:11px;color:var(--muted);white-space:nowrap}

/* Table section */
.table-section{padding:16px 12px 80px}
.table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.table-header h2{font-size:17px;color:var(--primary)}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border:1px solid #ddd;border-radius:16px;background:var(--card);cursor:pointer;font-size:11px;transition:all .2s;color:#555;white-space:nowrap}
.filter-btn:active{transform:scale(.95)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Table - horizontal scroll on mobile */
.table-wrap{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:640px;border-collapse:collapse}
thead{background:var(--primary);color:#fff;position:sticky;top:0;z-index:1}
th{padding:12px 14px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:12px;vertical-align:middle}
tr.data-row{cursor:pointer;transition:background .15s}
tr.data-row:active{background:#eef4fb}
.region-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap}
.batch-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;background:#f0f5ff;color:var(--accent);white-space:nowrap}
.name-cell{font-weight:600;color:var(--primary)}
.desc-cell{color:#666;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Scroll hint */
.scroll-hint{text-align:center;font-size:11px;color:#bbb;padding:6px 0;display:none}

/* Footer */
.footer{text-align:center;padding:16px;color:#aaa;font-size:11px;border-top:1px solid #eee;background:var(--card)}

/* Back to top */
.back-top{position:fixed;bottom:20px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.2);display:none;z-index:999;transition:opacity .3s}
.back-top:active{opacity:.7}

/* Desktop overrides */
@media(min-width:769px){
  .header{padding:32px 20px 28px}
  .header h1{font-size:30px;letter-spacing:3px}
  .header p{font-size:14px}
  .stats{max-width:900px;margin:20px auto;gap:16px}
  .stat-card{padding:20px}
  .stat-num{font-size:36px}
  .stat-label{font-size:13px}
  .map-section{max-width:1400px;margin:0 auto;padding:0 20px}
  #map{height:520px;min-height:auto}
  .legend{max-width:none;font-size:13px;padding:12px 16px;line-height:2}
  .info-box{max-width:280px;font-size:13px;padding:14px 18px}
  .search-wrap input{width:260px}
  .table-section{max-width:1400px;margin:0 auto;padding:20px 20px 60px}
  .table-header h2{font-size:20px}
  .filter-btn{padding:6px 14px;font-size:12px}
  .table-wrap{overflow-x:visible}
  table{min-width:auto}
  td,th{padding:12px 16px;font-size:13px}
  .desc-cell{max-width:320px}
  .scroll-hint{display:none!important}
}

/* Mobile specific */
@media(max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}
  .stat-card{padding:12px 6px}
  .stat-num{font-size:22px}
  .stat-label{font-size:10px}
  .map-section{padding:0 8px}
  #map{height:42vh;min-height:240px}
  .table-section{padding:12px 8px 80px}
  .table-header{flex-direction:column;align-items:flex-start}
  .filter-group{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .scroll-hint{display:block}
  .back-top{bottom:16px;right:12px;width:38px;height:38px;font-size:16px}
}

/* Smaller phones */
@media(max-width:374px){
  .header h1{font-size:18px}
  .stats{grid-template-columns:repeat(2,1fr);gap:6px}
  .stat-num{font-size:20px}
  #map{height:38vh}
}
</style>
</head>

var regionColors={"东北":"#e74c3c","华北":"#e67e22","华东":"#27ae60","华中":"#2980b9","华南":"#8e44ad","西南":"#16a085","西北":"#d4a017"};
var regionCounts={};
resorts.forEach(function(r){regionCounts[r.r]=(regionCounts[r.r]||0)+1});

// WGS84 -> GCJ02
function wgs84ToGcj02(lng,lat){
  var pi=3.14159265358979324,a=6378245.0,ee=0.00669342162296594323;
  function oC(l2,l3){return l2<72.004||l2>137.8347||l3<0.8293||l3>55.8271}
  function tL(x,y){var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;r+=(20*Math.sin(y*pi)+40*Math.sin(y/3*pi))*2/3;r+=(160*Math.sin(y/12*pi)+320*Math.sin(y*pi/30))*2/3;return r}
  function tN(x,y){var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;r+=(20*Math.sin(x*pi)+40*Math.sin(x/3*pi))*2/3;r+=(150*Math.sin(x/12*pi)+300*Math.sin(x/30*pi))*2/3;return r}
  if(oC(lng,lat))return[lng,lat];
  var dA=tL(lng-105,lat-35),dN=tN(lng-105,lat-35),rR=lat/180*pi,m=Math.sin(rR);
  m=1-ee*m*m;var sM=Math.sqrt(m);
  dA=(dA*180)/((a*(1-ee))/(m*sM)*pi);
  dN=(dN*180)/((a*(1-ee))/(m*sM)*pi)*Math.cos(rR);
  return[lng+dN,lat+dA];
}
function toG(lng,lat){try{return wgs84ToGcj02(lng,lat)}catch(e){return[lng,lat]}}

// MAP
var map=L.map('map',{scrollWheelZoom:true,zoomControl:false}).setView([35.5,108],4);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{
  subdomains:'1234',maxZoom:18,attribution:'&copy; Gaode'
}).addTo(map);

var allMarkers=[];
resorts.forEach(function(r){
  var c=regionColors[r.r],g=toG(r.lo,r.la);
  var popup='<div style="font-family:system-ui,sans-serif;min-width:180px">'
    +'<div style="font-size:14px;font-weight:700;color:#1a3a5c;margin-bottom:3px">'+r.n+'</div>'
    +'<div style="font-size:11px;color:#888;margin-bottom:4px">'+r.p+' · '+r.b+'</div>'
    +'<div style="font-size:12px;color:#555;line-height:1.5">'+r.d+'</div></div>';
  var m=L.circleMarker([g[1],g[0]],{radius:7,fillColor:c,color:'#fff',weight:2,opacity:1,fillOpacity:.88})
    .addTo(map).bindPopup(popup,{maxWidth:260});
  m._rd=r;allMarkers.push({marker:m,data:r});
});

// Legend
var legend=L.control({position:'bottomright'});
legend.onAdd=function(){
  var d=L.DomUtil.create('div','legend'),h='<h4>地区</h4><ul>';
  for(var rg in regionColors)h+='<li data-region="'+rg+'"><span style="background:'+regionColors[rg]+'"></span>'+rg+'('+regionCounts[rg]+')</li>';
  d.innerHTML=h+'</ul>';
  d.querySelectorAll('li').forEach(function(li){li.addEventListener('click',function(){filterByRegion(this.dataset.region)})});
  return d;
};
legend.addTo(map);

// Search

sc.onAdd=function(){
  var d=L.DomUtil.create('div','search-wrap');
  d.innerHTML='<input type="text" id="searchInput" placeholder="搜索名称或省份..."><span class="count" id="searchCount">85家</span>';
  L.DomEvent.disableClickPropagation(d);return d;
};
sc.addTo(map);

// TABLE
var tbody=document.getElementById('tableBody');
function renderTable(list){
  tbody.innerHTML='';
  list.forEach(function(r,i){
    var tr=document.createElement('tr');tr.className='data-row';
    tr.innerHTML='<td style="text-align:center;color:#aaa">'+(i+1)+'</td>'
      +'<td><span class="region-tag" style="background:'+regionColors[r.r]+'">'+r.r+'</span></td>'
      +'<td style="text-align:center;font-size:11px">'+r.p+'</td>'
      +'<td class="name-cell">'+r.n+'</td>'
      +'<td class="desc-cell" title="'+r.d+'">'+r.d+'</td>'
      +'<td><span class="batch-tag">'+r.b+'</span></td>';
    tr.addEventListener('click',function(){
      var g=toG(r.lo,r.la);map.setView([g[1],g[0]],10);
      allMarkers.forEach(function(m){if(m.data===r)m.marker.openPopup()});
      window.scrollTo({top:document.querySelector('.map-section').offsetTop-10,behavior:'smooth'});
    });
    tbody.appendChild(tr);
  });
}
renderTable(resorts);

// Filters
var fg=document.getElementById('filterGroup');
Object.keys(regionColors).forEach(function(rg){
  var b=document.createElement('button');b.className='filter-btn';b.dataset.region=rg;
  b.textContent=rg+'('+regionCounts[rg]+')';fg.appendChild(b);
});

var curF='全部';
function filterByRegion(rg){
  if(rg===curF)rg='全部';curF=rg;
  fg.querySelectorAll('.filter-btn').forEach(function(b){b.classList.toggle('active',b.dataset.region===rg)});
  var f=rg==='全部'?resorts:resorts.filter(function(r){return r.r===rg});
  renderTable(f);document.getElementById('searchCount').textContent=f.length+'家';
  allMarkers.forEach(function(m){rg==='全部'||m.data.r===rg?map.addLayer(m.marker):map.removeLayer(m.marker)});
  if(f.length>0){
    var pts=f.map(function(r){var g=toG(r.lo,r.la);return[g[1],g[0]]});
    map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:8});
  }
}
fg.querySelectorAll('.filter-btn').forEach(function(b){b.addEventListener('click',function(){filterByRegion(this.dataset.region)})});

// Search
document.getElementById('searchInput').addEventListener('input',function(){
  var q=this.value.trim().toLowerCase();
  if(!q){renderTable(resorts);document.getElementById('searchCount').textContent='85家';return}
  var m=resorts.filter(function(r){return r.n.toLowerCase().indexOf(q)>=0||r.p.indexOf(q)>=0||r.d.indexOf(q)>=0});
  renderTable(m);document.getElementById('searchCount').textContent='找到'+m.length+'家';
});

// Back to top
window.addEventListener('scroll',function(){document.getElementById('backTop').style.display=window.scrollY>300?'block':'none'});
