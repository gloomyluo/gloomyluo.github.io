<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>中国旅游全景地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
:root{--primary:#1a3a5c;--accent:#2d6a9f;--bg:#f0f2f5;--card:#fff;--text:#333;--muted:#888;--radius:12px;--resort:#2d6a9f;--attraction:#e74c3c;--hotel:#8e44ad;--heat:#ff6b35}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}

.header{background:linear-gradient(135deg,#1a3a5c,#2d6a9f,#1a3a5c);color:#fff;padding:24px 16px 20px;text-align:center}
.header h1{font-size:22px;font-weight:700;letter-spacing:1px}
.header p{font-size:12px;opacity:.75;margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:16px}
.stat-card{background:var(--card);border-radius:10px;padding:14px 8px;text-align:center;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.stat-num{font-size:24px;font-weight:700;color:var(--accent)}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px}

.map-section{padding:0 12px}
.map-wrapper{border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.08);position:relative}
#map{width:100%;height:52vh;min-height:300px;max-height:560px;background:#dde8f0}

.legend{background:rgba(255,255,255,.95);border-radius:8px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:11px;line-height:1.7;max-width:170px}
.legend h4{margin:0 0 4px;font-size:12px;color:#333;border-bottom:1px solid #eee;padding-bottom:3px}
.legend-section{margin-bottom:8px}
.legend-section:last-child{margin-bottom:0}
.legend-item{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:4px;cursor:pointer;transition:background .15s}
.legend-item:hover,.legend-item:active{background:#e8f0f8}
.legend-icon{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;border:1.5px solid #fff;box-shadow:0 0 3px rgba(0,0,0,.3);flex-shrink:0}
.legend-count{color:#999;font-size:10px}

.info-box{background:rgba(255,255,255,.95);border-radius:8px;padding:10px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:11px;line-height:1.5;max-width:200px}
.info-box h3{font-size:13px;color:var(--primary);margin-bottom:4px}
.info-box .region-features{margin-top:6px;padding-top:6px;border-top:1px solid #eee}
.info-box .feature-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.info-box .feature-tag{background:#e8f0f8;color:var(--accent);padding:2px 6px;border-radius:10px;font-size:10px}

.search-wrap{background:rgba(255,255,255,.95);border-radius:8px;padding:6px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;gap:6px}
.search-wrap input{border:1px solid #ddd;border-radius:6px;padding:6px 10px;font-size:13px;width:160px;outline:none;transition:border .2s}
.search-wrap input:focus{border-color:var(--accent)}
.search-wrap .count{font-size:11px;color:var(--muted);white-space:nowrap}

.layer-btn{position:absolute;top:10px;right:10px;z-index:1000;background:rgba(255,255,255,.95);border:none;border-radius:8px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;font-size:13px;font-weight:600;color:var(--primary);transition:all .2s}
.layer-btn:active{transform:scale(.95)}
.layer-btn.active{background:var(--accent);color:#fff}

.layer-panel{position:absolute;top:50px;right:10px;z-index:1000;background:rgba(255,255,255,.98);border-radius:10px;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none;min-width:200px}
.layer-panel.show{display:block}
.layer-panel h4{font-size:13px;color:var(--primary);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #eee}
.layer-option{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:6px;cursor:pointer;transition:background .15s}
.layer-option:hover{background:#f0f6fc}
.layer-option input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent)}
.layer-option .layer-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.layer-option .layer-name{font-size:13px;flex:1}
.layer-option .layer-count{font-size:11px;color:#999}

.heat-toggle{margin-top:8px;padding-top:8px;border-top:1px solid #eee}

.cascade-menu{position:absolute;left:10px;top:10px;z-index:1000;background:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;max-width:280px}
.cascade-menu.show{display:block}
.cascade-header{padding:10px 14px;font-size:13px;font-weight:600;color:var(--primary);border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
.cascade-close{background:none;border:none;font-size:18px;cursor:pointer;color:#999;line-height:1}
.cascade-regions{max-height:200px;overflow-y:auto}
.cascade-region{padding:8px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.cascade-region:hover,.cascade-region:active{background:#e8f0f8}
.cascade-region .region-name{display:flex;align-items:center;gap:6px}
.cascade-region .region-dot{width:10px;height:10px;border-radius:50%}
.cascade-region .arrow{color:#999;font-size:14px}
.cascade-details{display:none;background:#f8fafc;border-top:1px solid #eee}
.cascade-details.show{display:block}
.cascade-detail-section{padding:8px 14px}
.cascade-detail-section h5{font-size:12px;color:#666;margin-bottom:4px}
.cascade-tags{display:flex;flex-wrap:wrap;gap:4px}
.cascade-tag{background:#e8f0f8;color:var(--accent);padding:3px 8px;border-radius:10px;font-size:11px;cursor:pointer;transition:all .15s}
.cascade-tag:hover{background:var(--accent);color:#fff}
.cascade-list{max-height:150px;overflow-y:auto}
.cascade-item{padding:6px 14px;font-size:12px;cursor:pointer;transition:background .15s;border-bottom:1px solid #f0f0f0}
.cascade-item:hover{background:#e8f0f8}
.cascade-item .item-name{font-weight:600;color:var(--primary)}
.cascade-item .item-type{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px}
.type-resort{background:#e8f0f8;color:var(--resort)}
.type-attraction{background:#fee;color:var(--attraction)}
.type-hotel{background:#f3e8ff;color:var(--hotel)}

.menu-btn{position:absolute;left:10px;top:10px;z-index:1000;background:rgba(255,255,255,.95);border:none;border-radius:8px;padding:8px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer;font-size:13px;font-weight:600;color:var(--primary);transition:all .2s}
.menu-btn:active{transform:scale(.95)}

.table-section{padding:16px 12px 80px}
.table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.table-header h2{font-size:17px;color:var(--primary)}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border:1px solid #ddd;border-radius:16px;background:var(--card);cursor:pointer;font-size:11px;transition:all .2s;color:#555;white-space:nowrap}
.filter-btn:active{transform:scale(.95)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.table-wrap{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;min-width:640px;border-collapse:collapse}
thead{background:var(--primary);color:#fff;position:sticky;top:0;z-index:1}
th{padding:12px 14px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:12px;vertical-align:middle}
tr.data-row{cursor:pointer;transition:background .15s}
tr.data-row:active{background:#eef4fb}
.region-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;color:#fff;white-space:nowrap}
.type-tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;white-space:nowrap}
.name-cell{font-weight:600;color:var(--primary)}
.desc-cell{color:#666;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll-hint{text-align:center;font-size:11px;color:#bbb;padding:6px 0;display:none}

.footer{text-align:center;padding:16px;color:#aaa;font-size:11px;border-top:1px solid #eee;background:var(--card)}
.back-top{position:fixed;bottom:20px;right:16px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.2);display:none;z-index:999;transition:opacity .3s}
.back-top:active{opacity:.7}

@media(min-width:769px){
  .header{padding:32px 20px 28px}
  .header h1{font-size:30px;letter-spacing:3px}
  .header p{font-size:14px}
  .stats{max-width:900px;margin:20px auto;gap:12px}
  .stat-card{padding:20px}
  .stat-num{font-size:36px}
  .stat-label{font-size:13px}
  .map-section{max-width:1400px;margin:0 auto;padding:0 20px}
  #map{height:560px;min-height:auto}
  .legend{max-width:none;font-size:12px;padding:12px 16px}
  .info-box{max-width:280px;font-size:12px;padding:14px 18px}
  .search-wrap input{width:240px}
  .table-section{max-width:1400px;margin:0 auto;padding:20px 20px 60px}
  .table-header h2{font-size:20px}
  .filter-btn{padding:6px 14px;font-size:12px}
  .table-wrap{overflow-x:visible}
  table{min-width:auto}
  td,th{padding:12px 16px;font-size:13px}
  .desc-cell{max-width:320px}
  .scroll-hint{display:none!important}
}

@media(max-width:768px){
  .stats{grid-template-columns:repeat(3,1fr);gap:6px;padding:12px}
  .stat-card{padding:10px 4px}
  .stat-num{font-size:20px}
  .stat-label{font-size:9px}
  .map-section{padding:0 8px}
  #map{height:45vh;min-height:260px}
  .table-section{padding:12px 8px 80px}
  .table-header{flex-direction:column;align-items:flex-start}
  .filter-group{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .scroll-hint{display:block}
  .back-top{bottom:16px;right:12px;width:38px;height:38px;font-size:16px}
  .layer-panel{top:45px;right:8px;left:8px;min-width:auto}
  .cascade-menu{left:8px;right:8px;max-width:none}
}

@media(max-width:374px){
  .header h1{font-size:18px}
  .stats{grid-template-columns:repeat(3,1fr);gap:4px}
  .stat-num{font-size:18px}
  #map{height:40vh}
}
</style>
</head>
<body>

<div class="header">
  <h1>中国旅游全景地图</h1>
  <p>国家级旅游度假区 · 精选景点 · 亲子乐园 · 数据截至2024年6月</p>
</div>

<div class="stats">
  <div class="stat-card"><div class="stat-num" id="statResorts">-</div><div class="stat-label">度假区</div></div>
  <div class="stat-card"><div class="stat-num" id="statAttractions">-</div><div class="stat-label">精选景点</div></div>
  <div class="stat-card"><div class="stat-num" id="statHotels">-</div><div class="stat-label">亲子酒店/乐园</div></div>
  <div class="stat-card"><div class="stat-num" id="statRegions">-</div><div class="stat-label">覆盖省区</div></div>
  <div class="stat-card"><div class="stat-num">7</div><div class="stat-label">大地区</div></div>
</div>

<div class="map-section">
  <div class="map-wrapper">
    <div id="map"></div>
    <button class="layer-btn" id="layerBtn">⚙ 图层</button>
    <div class="layer-panel" id="layerPanel">
      <h4>图层控制</h4>
      <label class="layer-option">
        <input type="checkbox" id="showResorts" checked>
        <span class="layer-icon" style="background:var(--resort)">🏖</span>
        <span class="layer-name">度假区</span>
        <span class="layer-count" id="countResorts">85</span>
      </label>
      <label class="layer-option">
        <input type="checkbox" id="showAttractions" checked>
        <span class="layer-icon" style="background:var(--attraction)">⭐</span>
        <span class="layer-name">精选景点</span>
        <span class="layer-count" id="countAttractions">50</span>
      </label>
      <label class="layer-option">
        <input type="checkbox" id="showHotels" checked>
        <span class="layer-icon" style="background:var(--hotel)">🏨</span>
        <span class="layer-name">亲子酒店/乐园</span>
        <span class="layer-count" id="countHotels">20</span>
      </label>
      <div class="heat-toggle">
        <label class="layer-option">
          <input type="checkbox" id="showHeat">
          <span class="layer-icon" style="background:var(--heat)">🔥</span>
          <span class="layer-name">热力图</span>
        </label>
      </div>
    </div>
    <button class="menu-btn" id="menuBtn">☰ 地区导航</button>
    <div class="cascade-menu" id="cascadeMenu">
      <div class="cascade-header">
        <span>地区导航</span>
        <button class="cascade-close" id="cascadeClose">×</button>
      </div>
      <div class="cascade-regions" id="cascadeRegions"></div>
      <div class="cascade-details" id="cascadeDetails">
        <div class="cascade-detail-section">
          <h5>地区特色</h5>
          <div class="cascade-tags" id="regionFeatures"></div>
        </div>
        <div class="cascade-detail-section">
          <h5>该地区项目</h5>
          <div class="cascade-list" id="regionList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="table-section">
  <div class="table-header">
    <h2>完整名录</h2>
    <div class="filter-group" id="filterGroup">
      <button class="filter-btn active" data-type="all">全部</button>
      <button class="filter-btn" data-type="resort">🏖 度假区</button>
      <button class="filter-btn" data-type="attraction">⭐ 景点</button>
      <button class="filter-btn" data-type="hotel">🏨 亲子</button>
    </div>
  </div>
  <div class="scroll-hint">← 左右滑动查看完整表格 →</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:36px">#</th>
          <th style="width:64px">类型</th>
          <th style="width:64px">地区</th>
          <th style="width:100px">省区</th>
          <th>名称</th>
          <th>简介</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<div class="footer">
  数据来源：文化和旅游部 · 各省文旅厅 · 地图数据: Gaode/AMap
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
var resorts=[],attractions=[],hotels=[],allData=[],regionColors={},regionFeatures={};

function toG(lng,lat){
  var pi=3.14159265358979324,a=6378245.0,ee=0.00669342162296594323;
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271)return[lng,lat];
  function tL(x,y){var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;r+=(20*Math.sin(y*pi)+40*Math.sin(y/3*pi))*2/3;r+=(160*Math.sin(y/12*pi)+320*Math.sin(y*pi/30))*2/3;return r}
  function tN(x,y){var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;r+=(20*Math.sin(x*pi)+40*Math.sin(x/3*pi))*2/3;r+=(150*Math.sin(x/12*pi)+300*Math.sin(x/30*pi))*2/3;return r}
  var dA=tL(lng-105,lat-35),dN=tN(lng-105,lat-35),rR=lat/180*pi,m=Math.sin(rR);
  m=1-ee*m*m;var sM=Math.sqrt(m);
  dA=(dA*180)/((a*(1-ee))/(m*sM)*pi);
  dN=(dN*180)/((a*(1-ee))/(m*sM)*pi)*Math.cos(rR);
  return[lng+dN,lat+dA];
}

var map=L.map('map',{scrollWheelZoom:true,zoomControl:false}).setView([35.5,108],4);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'&copy; Gaode'}).addTo(map);

var layers={resort:L.layerGroup(),attraction:L.layerGroup(),hotel:L.layerGroup()};
layers.resort.addTo(map);layers.attraction.addTo(map);layers.hotel.addTo(map);
var heatLayer=null;
var markers={resort:[],attraction:[],hotel:[]};

var info=L.control({position:'topright'});
info.onAdd=function(){
  var d=L.DomUtil.create('div','info-box');
  d.id='infoBox';
  d.innerHTML='<h3>中国旅游全景</h3><div id="infoStats">加载中...</div><div id="infoRegion" style="display:none;margin-top:6px;padding-top:6px;border-top:1px solid #eee"><b id="infoRegionName"></b><div class="region-features"><span style="color:#888;font-size:10px">特色：</span><div class="feature-tags" id="infoFeatures"></div></div></div><div style="color:#888;font-size:10px;margin-top:4px">点击图标查看详情</div>';
  return d;
};
info.addTo(map);

var sc=L.control({position:'topleft'});
sc.onAdd=function(){
  var d=L.DomUtil.create('div','search-wrap');
  d.innerHTML='<input type="text" id="searchInput" placeholder="搜索名称或省份..."><span class="count" id="searchCount">-</span>';
  L.DomEvent.disableClickPropagation(d);return d;
};
sc.addTo(map);

var legend=L.control({position:'bottomright'});
legend.onAdd=function(){
  var d=L.DomUtil.create('div','legend');
  d.innerHTML='<h4>图例</h4>'
    +'<div class="legend-section"><div class="legend-item" data-layer="resort"><div class="legend-icon" style="background:var(--resort)">🏖</div><span>度假区</span><span class="legend-count" id="legendResortCount"></span></div>'
    +'<div class="legend-item" data-layer="attraction"><div class="legend-icon" style="background:var(--attraction)">⭐</div><span>景点</span><span class="legend-count" id="legendAttractionCount"></span></div>'
    +'<div class="legend-item" data-layer="hotel"><div class="legend-icon" style="background:var(--hotel)">🏨</div><span>亲子</span><span class="legend-count" id="legendHotelCount"></span></div></div>'
    +'<div class="legend-section" style="border-top:1px solid #eee;padding-top:6px"><div style="font-size:10px;color:#888;margin-bottom:3px">按地区筛选：</div><div id="legendRegions"></div></div>';
  return d;
};
legend.addTo(map);

function createMarker(item,type){
  var colors={resort:'#2d6a9f',attraction:'#e74c3c',hotel:'#8e44ad'};
  var icons={resort:'🏖',attraction:'⭐',hotel:'🏨'};
  var g=toG(item.lo,item.la);
  var popup='<div style="font-family:system-ui,sans-serif;min-width:180px">'
    +'<div style="font-size:14px;font-weight:700;color:#1a3a5c;margin-bottom:3px">'+icons[type]+' '+item.n+'</div>'
    +'<div style="font-size:11px;color:#888;margin-bottom:4px">'+item.p+' · '+(item.b||item.t||'')+'</div>'
    +'<div style="font-size:12px;color:#555;line-height:1.5">'+item.d+'</div></div>';
  var m=L.circleMarker([g[1],g[0]],{radius:type==='resort'?7:6,fillColor:colors[type],color:'#fff',weight:2,opacity:1,fillOpacity:.88});
  m.bindPopup(popup,{maxWidth:260});
  m._item=item;m._type=type;
  layers[type].addLayer(m);
  markers[type].push(m);
  return m;
}

function buildHeat(){
  var pts=[];
  allData.forEach(function(item){var g=toG(item.lo,item.la);pts.push([g[1],g[0],1]);});
  if(heatLayer)map.removeLayer(heatLayer);
  heatLayer=L.heatLayer(pts,{radius:25,blur:15,maxZoom:8,max:1.5,gradient:{0.2:'blue',0.4:'cyan',0.6:'lime',0.8:'yellow',1:'red'}});
}

function updateInfoStats(){
  document.getElementById('infoStats').innerHTML='度假区 <b style="color:#2d6a9f">'+resorts.length+'</b> · 景点 <b style="color:#e74c3c">'+attractions.length+'</b> · 亲子 <b style="color:#8e44ad">'+hotels.length+'</b>';
}

function showRegionInfo(region){
  var el=document.getElementById('infoRegion');
  if(!region){el.style.display='none';return;}
  el.style.display='block';
  document.getElementById('infoRegionName').textContent=region;
  var features=regionFeatures[region]||[];
  document.getElementById('infoFeatures').innerHTML=features.map(function(f){return '<span class="feature-tag">'+f+'</span>';}).join('');
}

function filterByRegion(region){
  var items=allData.filter(function(i){return !region||i.r===region;});
  renderTable(items);
  document.getElementById('searchCount').textContent=items.length+'个';
  ['resort','attraction','hotel'].forEach(function(type){
    layers[type].clearLayers();
    markers[type]=[];
  });
  items.forEach(function(item){createMarker(item,item._type);});
  showRegionInfo(region);
  if(region){
    var pts=items.map(function(i){var g=toG(i.lo,i.la);return[g[1],g[0]];});
    if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:8});
  }else{
    map.setView([35.5,108],4);
  }
}

function renderTable(list){
  var tbody=document.getElementById('tableBody');
  tbody.innerHTML='';
  var typeLabels={resort:{cls:'type-resort',label:'度假区'},attraction:{cls:'type-attraction',label:'景点'},hotel:{cls:'type-hotel',label:'亲子'}};
  list.forEach(function(r,i){
    var tl=typeLabels[r._type];
    var tr=document.createElement('tr');tr.className='data-row';
    tr.innerHTML='<td style="text-align:center;color:#aaa">'+(i+1)+'</td>'
      +'<td><span class="type-tag '+tl.cls+'">'+tl.label+'</span></td>'
      +'<td><span class="region-tag" style="background:'+(regionColors[r.r]||'#999')+'">'+r.r+'</span></td>'
      +'<td style="text-align:center;font-size:11px">'+r.p+'</td>'
      +'<td class="name-cell">'+r.n+'</td>'
      +'<td class="desc-cell" title="'+r.d+'">'+r.d+'</td>';
    tr.addEventListener('click',function(){
      var g=toG(r.lo,r.la);map.setView([g[1],g[0]],10);
      var m=markers[r._type].find(function(m){return m._item===r;});
      if(m)m.openPopup();
      window.scrollTo({top:document.querySelector('.map-section').offsetTop-10,behavior:'smooth'});
    });
    tbody.appendChild(tr);
  });
}

function initFilters(){
  var fg=document.getElementById('filterGroup');
  fg.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      fg.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
      this.classList.add('active');
      var type=this.dataset.type;
      var items=type==='all'?allData:allData.filter(function(i){return i._type===type;});
      renderTable(items);
      document.getElementById('searchCount').textContent=items.length+'个';
    });
  });
}

function initLegend(){
  var container=document.getElementById('legendRegions');
  Object.keys(regionColors).forEach(function(region){
    var count=allData.filter(function(i){return i.r===region;}).length;
    var div=document.createElement('div');
    div.className='legend-item';
    div.innerHTML='<div class="legend-icon" style="background:'+regionColors[region]+';font-size:8px;color:#fff">'+region.charAt(0)+'</div><span>'+region+'</span><span class="legend-count">('+count+')</span>';
    div.addEventListener('click',function(){filterByRegion(region);});
    container.appendChild(div);
  });
  document.querySelectorAll('.legend-item[data-layer]').forEach(function(item){
    item.addEventListener('click',function(){
      var type=this.dataset.layer;
      var checkbox=document.getElementById('show'+type.charAt(0).toUpperCase()+type.slice(1));
      checkbox.checked=!checkbox.checked;
      checkbox.dispatchEvent(new Event('change'));
    });
  });
}

function initCascadeMenu(){
  var container=document.getElementById('cascadeRegions');
  Object.keys(regionColors).forEach(function(region){
    var count=allData.filter(function(i){return i.r===region;}).length;
    var div=document.createElement('div');
    div.className='cascade-region';
    div.innerHTML='<span class="region-name"><span class="region-dot" style="background:'+regionColors[region]+'"></span>'+region+'</span><span><span style="color:#999;font-size:11px">'+count+'个</span> <span class="arrow">›</span></span>';
    div.addEventListener('click',function(){showCascadeDetails(region);});
    container.appendChild(div);
  });
}

function showCascadeDetails(region){
  var details=document.getElementById('cascadeDetails');
  details.classList.add('show');
  var features=regionFeatures[region]||[];
  document.getElementById('regionFeatures').innerHTML=features.map(function(f){return '<span class="cascade-tag" onclick="filterByRegion(\''+region+'\')">'+f+'</span>';}).join('');
  var items=allData.filter(function(i){return i.r===region;});
  var typeLabels={resort:'度假区',attraction:'景点',hotel:'亲子'};
  document.getElementById('regionList').innerHTML=items.map(function(i){
    return '<div class="cascade-item" onclick="focusItem(\''+i._type+'\',\''+i.n.replace(/'/g,"\\'")+'\')"><span class="item-name">'+i.n+'</span><span class="item-type type-'+i._type+'">'+typeLabels[i._type]+'</span></div>';
  }).join('');
}

function focusItem(type,name){
  var item=allData.find(function(i){return i._type===type&&i.n===name;});
  if(item){
    var g=toG(item.lo,item.la);map.setView([g[1],g[0]],11);
    var m=markers[type].find(function(m){return m._item===item;});
    if(m)m.openPopup();
    document.getElementById('cascadeMenu').classList.remove('show');
  }
}

function initControls(){
  document.getElementById('layerBtn').addEventListener('click',function(){
    document.getElementById('layerPanel').classList.toggle('show');
    this.classList.toggle('active');
  });
  document.getElementById('menuBtn').addEventListener('click',function(){
    document.getElementById('cascadeMenu').classList.toggle('show');
  });
  document.getElementById('cascadeClose').addEventListener('click',function(){
    document.getElementById('cascadeMenu').classList.remove('show');
    document.getElementById('cascadeDetails').classList.remove('show');
  });
  ['resort','attraction','hotel'].forEach(function(type){
    var id='show'+type.charAt(0).toUpperCase()+type.slice(1);
    document.getElementById(id).addEventListener('change',function(){
      if(this.checked){layers[type].addTo(map);}else{map.removeLayer(layers[type]);}
    });
  });
  document.getElementById('showHeat').addEventListener('change',function(){
    if(this.checked){if(!heatLayer)buildHeat();heatLayer.addTo(map);}
    else if(heatLayer){map.removeLayer(heatLayer);}
  });
  document.getElementById('searchInput').addEventListener('input',function(){
    var q=this.value.trim().toLowerCase();
    if(!q){renderTable(allData);document.getElementById('searchCount').textContent=allData.length+'个';return;}
    var m=allData.filter(function(i){return i.n.toLowerCase().indexOf(q)>=0||i.p.indexOf(q)>=0||i.d.indexOf(q)>=0;});
    renderTable(m);document.getElementById('searchCount').textContent='找到'+m.length+'个';
  });
  window.addEventListener('scroll',function(){
    document.getElementById('backTop').style.display=window.scrollY>300?'block':'none';
  });
}

function updateStats(){
  var provinces=new Set();allData.forEach(function(i){provinces.add(i.p);});
  document.getElementById('statResorts').textContent=resorts.length;
  document.getElementById('statAttractions').textContent=attractions.length;
  document.getElementById('statHotels').textContent=hotels.length;
  document.getElementById('statRegions').textContent=provinces.size;
  document.getElementById('countResorts').textContent=resorts.length;
  document.getElementById('countAttractions').textContent=attractions.length;
  document.getElementById('countHotels').textContent=hotels.length;
  document.getElementById('legendResortCount').textContent='('+resorts.length+')';
  document.getElementById('legendAttractionCount').textContent='('+attractions.length+')';
  document.getElementById('legendHotelCount').textContent='('+hotels.length+')';
  document.getElementById('searchCount').textContent=allData.length+'个';
  updateInfoStats();
}

function init(){
  Promise.all([
    fetch('data/resorts.json').then(function(r){return r.json();}),
    fetch('data/attractions.json').then(function(r){return r.json();}),
    fetch('data/hotels.json').then(function(r){return r.json();}),
    fetch('data/regions.json').then(function(r){return r.json();})
  ]).then(function(data){
    resorts=data[0].map(function(i){i._type='resort';return i;});
    attractions=data[1].map(function(i){i._type='attraction';return i;});
    hotels=data[2].map(function(i){i._type='hotel';return i;});
    regionFeatures=data[3];
    Object.keys(regionFeatures).forEach(function(r){regionColors[r]=regionFeatures[r].color;});
    allData=resorts.concat(attractions,hotels);
    allData.forEach(function(item){createMarker(item,item._type);});
    buildHeat();
    renderTable(allData);
    updateStats();
    initFilters();
    initLegend();
    initCascadeMenu();
    initControls();
  }).catch(function(err){console.error('加载数据失败:',err);});
}

init();
</script>
</body>
</html>
