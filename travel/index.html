<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>家庭旅行规划 · 旅游地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
:root{--primary:#1a3a5c;--accent:#2d6a9f;--orange:#ff6b35;--purple:#8e44ad;--bg:#f5f7fa;--card:#fff;--text:#333;--muted:#888;--border:#e8ecf0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,.05)}
.nav-inner{max-width:1600px;margin:0 auto;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-size:17px;font-weight:800;color:var(--primary)}
.nav-logo span{color:var(--orange)}
.nav-menu{display:flex;gap:4px}
.nav-menu a{padding:7px 14px;border-radius:18px;font-size:13px;font-weight:500;color:#555;transition:all .2s}
.nav-menu a:hover,.nav-menu a.active{background:var(--accent);color:#fff}
.nav-toggle{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--primary)}

/* LAYOUT: Airbnb-style split, full viewport */
.main{position:fixed;top:54px;left:0;right:0;bottom:0;max-width:1600px;margin:0 auto;display:grid;grid-template-columns:420px 1fr;gap:12px;padding:12px 16px 12px 16px}

/* LEFT LIST */
.panel{background:var(--card);border-radius:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{padding:14px 16px 0;flex-shrink:0}
.panel-title{font-size:15px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel-title::before{content:'';width:3px;height:15px;background:var(--orange);border-radius:2px}
.panel-title span{font-size:12px;font-weight:400;color:var(--muted);margin-left:auto}

.category-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cat-tab{padding:6px 13px;border:1.5px solid var(--border);border-radius:18px;background:transparent;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;color:#666}
.cat-tab:hover{border-color:var(--accent);color:var(--accent)}
.cat-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.region-filter{display:flex;gap:5px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border)}
.region-btn{padding:4px 10px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:11px;cursor:pointer;transition:all .15s;color:#666}
.region-btn:hover,.region-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.items-list{flex:1;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.items-list::-webkit-scrollbar{width:5px}
.items-list::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.items-list::-webkit-scrollbar-track{background:transparent}

.item-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s;display:flex;min-height:86px}
.item-card:hover{border-color:#b8c9d9;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.item-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(45,106,159,.3)}
.item-img{width:100px;min-height:86px;height:auto;object-fit:cover;background:#e0e8f0;flex-shrink:0}
.item-body{padding:8px 10px;flex:1;display:flex;flex-direction:column;min-width:0}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:2px}
.item-name{font-size:13px;font-weight:700;color:var(--primary);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-badge{padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
.badge-resort{background:#e8f4fd;color:var(--accent)}
.badge-attraction{background:#fff0e8;color:var(--orange)}
.badge-hotel{background:#f3e8ff;color:var(--purple)}
.grade-badge{padding:1px 5px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.3px;flex-shrink:0;line-height:1.4}
.grade-5a{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff}
.grade-4a{background:linear-gradient(135deg,#d68910,#f39c12);color:#fff}
.grade-row{display:flex;gap:4px;align-items:center;justify-content:flex-end;flex-shrink:0}
.item-meta{font-size:11px;color:var(--muted);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-desc{font-size:11.5px;color:#777;line-height:1.4;flex:1;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px}
.item-footer{display:flex;justify-content:space-between;align-items:center;gap:6px}
.item-price{font-size:13px;font-weight:700;color:var(--orange)}
.item-price small{font-size:10px;color:var(--muted);font-weight:400}
.item-heat{display:flex;align-items:center;gap:4px;flex:1;max-width:120px}
.heat-track{flex:1;height:4px;background:#e8ecf0;border-radius:2px;overflow:hidden}
.heat-fill{height:100%;border-radius:2px}
.heat-low{background:#27ae60}
.heat-mid{background:#f1c40f}
.heat-high{background:#ff6b35}
.heat-value{font-size:10px;font-weight:600;color:#666}

/* RIGHT MAP */
.map-col{display:flex;flex-direction:column;min-height:0;gap:8px}
.map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;padding:0 4px;flex-wrap:wrap}
.map-toolbar-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.map-title{font-size:14px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px}
.map-title::before{content:'';width:3px;height:14px;background:var(--orange);border-radius:2px}
.map-toolbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.view-toggle{display:flex;gap:3px;background:#eef2f6;padding:3px;border-radius:10px}
.view-btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;color:#666;border:none;background:none}
.view-btn:hover{background:#dde5ed}
.view-btn.active{background:var(--primary);color:#fff}
.map-tabs{display:flex;gap:3px;background:#eef2f6;padding:3px;border-radius:10px}
.map-tab{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;color:#666;border:none;background:none}
.map-tab:hover{background:#dde5ed}
.map-tab.active{background:var(--accent);color:#fff}
.holiday-select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:#fff;color:#444;cursor:pointer;max-width:160px;outline:none}
.holiday-select:focus{border-color:var(--accent)}
.holiday-badge{font-size:11px;color:var(--muted);white-space:nowrap}
.holiday-badge b{color:var(--orange);font-weight:600}
.heat-legend{display:none;align-items:center;gap:6px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.92);padding:5px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.heat-legend.show{display:flex}
.heat-legend-bar{width:80px;height:8px;border-radius:4px;background:linear-gradient(90deg,#27ae60,#f1c40f,#ff6b35,#e74c3c)}
.map-wrap{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.06);background:#dde8f0}
#map{width:100%;height:100%}
.heat-note{position:absolute;left:10px;bottom:10px;z-index:500;font-size:11px;color:#666;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:none;max-width:70%}
.heat-note.show{display:block}
.heat-note a{color:var(--accent)}

/* LEAFLET POPUP DETAIL (replaces modal) */
.mini-popup{min-width:220px;max-width:260px;font-family:inherit}
.mini-popup .mp-img{width:100%;height:110px;object-fit:cover;border-radius:8px;background:#e0e8f0;margin-bottom:8px}
.mini-popup .mp-name{font-size:15px;font-weight:800;color:#1a3a5c;margin-bottom:4px;line-height:1.3}
.mini-popup .mp-meta{font-size:12px;color:#888;margin-bottom:6px}
.mini-popup .grade-badge{display:inline-block;vertical-align:middle;margin-right:4px}
.mini-popup .mp-desc{font-size:12px;color:#555;line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-popup .mp-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:5px 0;border-top:1px solid #eef2f6}
.mini-popup .mp-price{font-weight:700;color:#ff6b35;font-size:14px}
.mini-popup .mp-price small{font-size:10px;color:#888;font-weight:400}
.mini-popup .mp-links{display:flex;gap:6px;margin-top:8px}
.mini-popup .mp-links a{flex:1;padding:7px 4px;border-radius:8px;font-size:11.5px;font-weight:600;text-align:center;text-decoration:none}
.mini-popup .mp-links .mp-primary{background:#2d6a9f;color:#fff}
.mini-popup .mp-links .mp-secondary{background:#f0f4f8;color:#2d6a9f;border:1px solid #e0e8f0}
.mini-popup .leaflet-popup-content{margin:10px}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.leaflet-popup-tip{box-shadow:0 2px 8px rgba(0,0,0,.1)}

/* DETAIL DRAWER (slides over LIST only, map always visible) */
.drawer{position:absolute;top:12px;left:16px;bottom:12px;width:420px;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:50;display:none;flex-direction:column;overflow:hidden}
.drawer.show{display:flex}
.drawer-scroll{overflow-y:auto;flex:1}
.drawer-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:18px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center}
.drawer-close:hover{background:rgba(0,0,0,.75)}
.drawer-img{width:100%;height:200px;object-fit:cover;background:#e0e8f0}
.drawer-body{padding:18px 20px 24px}
.drawer-name{font-size:20px;font-weight:800;color:var(--primary);margin-bottom:6px}
.drawer-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.drawer-tag{padding:3px 10px;border-radius:10px;font-size:12px}
.drawer-desc{font-size:14px;color:#555;line-height:1.7;margin-bottom:14px}
.drawer-info{background:#f8fafc;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.drawer-info-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.drawer-info-row:last-child{border-bottom:none}
.drawer-info-label{color:var(--muted);min-width:72px}
.drawer-info-value{font-weight:600}
.drawer-links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.drawer-links a{flex:1;min-width:100px;padding:10px 12px;border-radius:10px;text-align:center;font-size:13px;font-weight:600}
.drawer-links .d-primary{background:var(--accent);color:#fff}
.drawer-links .d-primary:hover{background:#1a5276}
.drawer-links .d-secondary{background:#f0f4f8;color:var(--accent);border:1px solid var(--border)}
.drawer-region{background:#f8fafc;border-radius:10px;padding:12px 14px}
.drawer-region-title{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px}
.drawer-region-tags{display:flex;gap:6px;flex-wrap:wrap}
.drawer-region-tag{padding:4px 10px;background:#e8f0f8;color:var(--accent);border-radius:12px;font-size:12px;cursor:pointer}
.drawer-region-tag:hover{background:var(--accent);color:#fff}

/* LOADING / EMPTY */
.loading{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
.loading-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:#999;font-size:13px}

/* MOBILE: stack */
@media(max-width:900px){
  body{overflow:auto}
  .main{position:static;display:flex;flex-direction:column;padding:66px 12px 12px;height:auto;max-width:none}
  .map-col{order:-1;height:52vh;min-height:320px}
  .panel{max-height:none}
  .items-list{max-height:60vh}
  .drawer{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;border-radius:0;z-index:2000}
  .nav-menu{display:none;position:absolute;top:54px;left:0;right:0;background:#fff;flex-direction:column;padding:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
  .nav-menu.show{display:flex}
  .nav-toggle{display:block}
  .category-tabs{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}
  .cat-tab{white-space:nowrap}
}
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo">家庭<span>旅行</span>规划</a>
    <div class="nav-menu" id="navMenu">
      <a href="#" class="active">目的地</a>
      <a href="../index.html">博客首页</a>
    </div>
    <button class="nav-toggle" id="navToggle">☰</button>
  </div>
</nav>

<!-- MAIN SPLIT -->
<div class="main">
  <!-- LEFT: LIST -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">目的地列表 <span id="resultCount"></span></div>
      <div class="category-tabs">
        <button class="cat-tab active" data-type="all">全部</button>
        <button class="cat-tab" data-type="resort">🏖 度假区</button>
        <button class="cat-tab" data-type="attraction">⭐ 景点</button>
        <button class="cat-tab" data-type="hotel">🏨 亲子</button>
      </div>
      <div class="region-filter" id="regionFilter">
        <button class="region-btn active" data-region="all">全部</button>
        <button class="region-btn" data-region="华北">华北</button>
        <button class="region-btn" data-region="东北">东北</button>
        <button class="region-btn" data-region="华东">华东</button>
        <button class="region-btn" data-region="华中">华中</button>
        <button class="region-btn" data-region="华南">华南</button>
        <button class="region-btn" data-region="西南">西南</button>
        <button class="region-btn" data-region="西北">西北</button>
      </div>
    </div>
    <div class="items-list" id="itemsList">
      <div class="loading"><div class="loading-spinner"></div>加载中...</div>
    </div>
  </div>

  <!-- RIGHT: MAP -->
  <div class="map-col">
    <div class="map-toolbar">
      <div class="map-toolbar-left">
        <div class="map-title">📍 分布地图</div>
        <div class="view-toggle">
          <button class="view-btn active" data-view="marker">标记点</button>
          <button class="view-btn" data-view="heat">🔥 节假日热力</button>
        </div>
        <select class="holiday-select" id="holidaySelect" title="选择节假日" style="display:none">
          <option value="">加载节假日…</option>
        </select>
        <span class="holiday-badge" id="holidayBadge"></span>
      </div>
      <div class="map-toolbar-right">
        <div class="map-tabs">
          <button class="map-tab active" data-layer="all">全部</button>
          <button class="map-tab" data-layer="resort">度假区</button>
          <button class="map-tab" data-layer="attraction">景点</button>
          <button class="map-tab" data-layer="hotel">亲子</button>
        </div>
      </div>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="heat-legend" id="heatLegend"><span>低</span><span class="heat-legend-bar"></span><span>高</span></div>
      <div class="heat-note" id="heatNote">热力基于景点热度数据模拟 · 节假日日历来自 <a href="https://public-holidays.toolhub.run/" target="_blank">公开节假日 API</a> · 实时客流接口需企业授权</div>
    </div>
  </div>

  <!-- DETAIL DRAWER over list (map stays visible) -->
  <div class="drawer" id="drawer">
    <button class="drawer-close" id="drawerClose">×</button>
    <div class="drawer-scroll">
      <img class="drawer-img" id="drawerImg" src="" alt="">
      <div class="drawer-body">
        <div class="drawer-name" id="drawerName"></div>
        <div class="drawer-meta" id="drawerMeta"></div>
        <div class="drawer-desc" id="drawerDesc"></div>
        <div class="drawer-info" id="drawerInfo"></div>
        <div class="drawer-links" id="drawerLinks"></div>
        <div class="drawer-region" id="drawerRegion"></div>
      </div>
    </div>
  </div>
</div>

<script>
// DATA
var resorts=[],attractions=[],hotels=[],allData=[],regionFeatures={};

var typeConfig={
  resort:{label:'度假区',color:'#2d6a9f',badge:'badge-resort'},
  attraction:{label:'景点',color:'#ff6b35',badge:'badge-attraction'},
  hotel:{label:'亲子',color:'#8e44ad',badge:'badge-hotel'}
};

function toG(lng,lat){
  var pi=3.14159265358979324,a=6378245.0,ee=0.00669342162296594323;
  if(lng<72.004||lng>137.8347||lat<0.8293||lat>55.8271)return[lng,lat];
  function tL(x,y){var r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;r+=(20*Math.sin(y*pi)+40*Math.sin(y/3*pi))*2/3;r+=(160*Math.sin(y/12*pi)+320*Math.sin(y*pi/30))*2/3;return r}
  function tN(x,y){var r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));r+=(20*Math.sin(6*x*pi)+20*Math.sin(2*x*pi))*2/3;r+=(20*Math.sin(x*pi)+40*Math.sin(x/3*pi))*2/3;r+=(150*Math.sin(x/12*pi)+300*Math.sin(x/30*pi))*2/3;return r}
  var dA=tL(lng-105,lat-35),dN=tN(lng-105,lat-35),rR=lat/180*pi,m=Math.sin(rR);
  m=1-ee*m*m;var sM=Math.sqrt(m);
  dA=(dA*180)/((a*(1-ee))/(m*sM)*pi);
  dN=(dN*180)/((a*(1-ee))/(m*sM)*pi)*Math.cos(rR);
  return[lng+dN,lat+dA];
}

// MAP
var map=L.map('map',{scrollWheelZoom:true,zoomControl:false}).setView([35.5,108],4);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18}).addTo(map);
var markerLayers={resort:L.layerGroup().addTo(map),attraction:L.layerGroup().addTo(map),hotel:L.layerGroup().addTo(map)};
var markerIndex={};

// HEAT LAYER
var heatLayer=null;
var currentView='marker';
var holidays=[];
var currentHoliday=null;

// holiday weight multipliers by name keyword
function holidayMultiplier(name){
  if(!name)return 1;
  if(/春节|Spring/i.test(name))return 1.6;
  if(/国庆|National Day/i.test(name))return 1.5;
  if(/五一|劳动|Labour|Labor/i.test(name))return 1.4;
  if(/中秋|Mid-Autumn/i.test(name))return 1.3;
  if(/清明|Tomb|端午|Dragon/i.test(name))return 1.2;
  if(/元旦|New Year/i.test(name))return 1.1;
  return 1.15;
}

function baseWeight(item){
  if(item._type==='attraction')return (item.heat||50)/100;
  if(item._type==='resort')return 0.55;
  return 0.45;
}

function buildHeatPoints(mult){
  var pts=[];
  getFilteredData().forEach(function(item){
    var g=toG(item.lo,item.la);
    var w=Math.min(1,baseWeight(item)*mult);
    pts.push([g[1],g[0],w]);
  });
  return pts;
}

function showHeatLayer(){
  if(typeof L.heatLayer!=='function'){
    document.getElementById('heatNote').textContent='热力插件加载失败，请刷新重试';
    document.getElementById('heatNote').classList.add('show');
    return;
  }
  var mult=currentHoliday?holidayMultiplier(currentHoliday.localName||currentHoliday.name):1.2;
  var pts=buildHeatPoints(mult);
  if(heatLayer)map.removeLayer(heatLayer);
  heatLayer=L.heatLayer(pts,{
    radius:36,
    blur:28,
    maxZoom:8,
    max:1.0,
    gradient:{0.15:'#27ae60',0.4:'#f1c40f',0.65:'#ff6b35',1:'#e74c3c'}
  }).addTo(map);
  Object.keys(markerLayers).forEach(function(t){
    if(map.hasLayer(markerLayers[t]))map.removeLayer(markerLayers[t]);
  });
  document.getElementById('heatLegend').classList.add('show');
  document.getElementById('heatNote').classList.add('show');
  var holName=currentHoliday?(currentHoliday.localName||currentHoliday.name):'默认';
  document.getElementById('holidayBadge').innerHTML='当前：<b>'+holName+'</b>';
}

function showMarkerLayer(){
  if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
  Object.keys(markerLayers).forEach(function(t){
    if(!map.hasLayer(markerLayers[t]))markerLayers[t].addTo(map);
  });
  document.getElementById('heatLegend').classList.remove('show');
  document.getElementById('heatNote').classList.remove('show');
}

function setViewMode(mode){
  currentView=mode;
  document.querySelectorAll('.view-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.view===mode);
  });
  var sel=document.getElementById('holidaySelect');
  if(mode==='heat'){
    sel.style.display='';
    showHeatLayer();
  }else{
    sel.style.display='none';
    showMarkerLayer();
  }
}

// PUBLIC HOLIDAY API
function loadHolidays(){
  var year=new Date().getFullYear();
  fetch('https://public-holidays.toolhub.run/api/public-holidays?year='+year+'&code=cn')
    .then(function(r){return r.json();})
    .then(function(res){
      holidays=res.data||[];
      var sel=document.getElementById('holidaySelect');
      var now=new Date();
      var upcoming=holidays.filter(function(h){
        return new Date(h.endDate)>=now;
      });
      var list=(upcoming.length?upcoming:holidays);
      sel.innerHTML=list.map(function(h,i){
        var d=new Date(h.startDate);
        var label=(h.localName||h.name)+' · '+(d.getMonth()+1)+'/'+d.getDate();
        return '<option value="'+i+'">'+label+'</option>';
      }).join('');
      // default: nearest upcoming or 全年综合
      currentHoliday=list[0]||null;
      sel.value='0';
      if(currentHoliday){
        document.getElementById('holidayBadge').innerHTML='下个假期：<b>'+(currentHoliday.localName||currentHoliday.name)+'</b>';
      }
      sel.addEventListener('change',function(){
        currentHoliday=list[parseInt(this.value,10)]||null;
        if(currentView==='heat')showHeatLayer();
        else if(currentHoliday){
          document.getElementById('holidayBadge').innerHTML='下个假期：<b>'+(currentHoliday.localName||currentHoliday.name)+'</b>';
        }
      });
      if(currentView==='heat')showHeatLayer();
    })
    .catch(function(){
      document.getElementById('holidaySelect').innerHTML='<option value="">节假日接口不可用</option>';
      document.getElementById('holidayBadge').textContent='';
    });
}

var currentType='all';
var currentRegion='all';

function getFilteredData(){
  return allData.filter(function(item){
    if(currentType!=='all'&&item._type!==currentType)return false;
    if(currentRegion!=='all'&&item.r!==currentRegion)return false;
    return true;
  });
}

function getHeatClass(heat){
  if(heat<=40)return'heat-low';
  if(heat<=70)return'heat-mid';
  return'heat-high';
}

function priceText(item){
  if(!item.price)return'';
  var unit=item.priceUnit?'/'+item.priceUnit:'';
  return item.price==='免费'?'免费':'¥'+item.price+' <small>'+unit+'</small>';
}

function gradeHtml(item){
  if(!item.g)return'';
  var cls=item.g==='5A'?'grade-5a':'grade-4a';
  return '<span class="grade-badge '+cls+'">'+item.g+'</span>';
}

// LIST CARD
function renderItemCard(item){
  var cfg=typeConfig[item._type];
  var heatHtml='';
  if(item._type==='attraction'&&item.heat){
    heatHtml='<div class="item-heat"><div class="heat-track"><div class="heat-fill '+getHeatClass(item.heat)+'" style="width:'+item.heat+'%"></div></div><span class="heat-value">'+item.heat+'</span></div>';
  }
  return '<div class="item-card" data-type="'+item._type+'" data-name="'+item.n+'" onclick="selectItem(\''+item._type+'\',\''+item.n.replace(/'/g,"\\'")+'\',true)">'
    +'<img class="item-img" src="'+item.img+'" alt="'+item.n+'" loading="lazy">'
    +'<div class="item-body">'
    +'<div class="item-top"><div class="item-name">'+item.n+'</div><div class="grade-row">'+gradeHtml(item)+'<span class="item-badge '+cfg.badge+'">'+cfg.label+'</span></div></div>'
    +'<div class="item-meta">📍 '+item.p+(item.b?' · 📋 '+item.b:'')+'</div>'
    +'<div class="item-desc">'+item.d+'</div>'
    +'<div class="item-footer"><span class="item-price">'+priceText(item)+'</span>'+heatHtml+'</div>'
    +'</div></div>';
}

function renderItems(){
  var filtered=getFilteredData();
  var list=document.getElementById('itemsList');
  if(filtered.length===0){
    list.innerHTML='<div class="empty">未找到匹配结果</div>';
  }else{
    list.innerHTML=filtered.map(renderItemCard).join('');
  }
  document.getElementById('resultCount').textContent='共 '+filtered.length+' 个';
}

// MAP POPUP (compact detail inside map)
function buildPopupHtml(item){
  var cfg=typeConfig[item._type];
  var g=toG(item.lo,item.la);
  var amapLink='https://uri.amap.com/marker?position='+g[0]+','+g[1]+'&name='+encodeURIComponent(item.n);
  var ctripLink=item.link||'https://www.ctrip.com';
  var heatRow='';
  if(item._type==='attraction'&&item.heat){
    heatRow='<div class="mp-row"><span>🔥 热度</span><span><span class="heat-track" style="display:inline-block;width:70px;vertical-align:middle"><span class="heat-fill '+getHeatClass(item.heat)+'" style="display:block;width:'+item.heat+'%"></span></span> '+item.heat+'</span></div>';
  }
  return '<div class="mini-popup">'
    +'<img class="mp-img" src="'+item.img+'" alt="">'
    +'<div class="mp-name">'+item.n+'</div>'
    +'<div class="mp-meta">'+gradeHtml(item)+cfg.label+' · 📍 '+item.p+(item.b?' · 📋 '+item.b:'')+'</div>'
    +'<div class="mp-desc">'+item.d+'</div>'
    +(item.price?'<div class="mp-row"><span>💰 价格</span><span class="mp-price">'+priceText(item)+'</span></div>':'')
    +heatRow
    +'<div class="mp-links">'
    +'<a class="mp-primary" href="'+amapLink+'" target="_blank">高德导航</a>'
    +'<a class="mp-secondary" href="'+ctripLink+'" target="_blank">携程详情</a>'
    +'<a class="mp-secondary" href="#" onclick="openDrawer(\''+item._type+'\',\''+item.n.replace(/'/g,"\\'")+'\');return false">更多信息</a>'
    +'</div></div>';
}

function renderMapMarkers(){
  Object.keys(markerLayers).forEach(function(type){markerLayers[type].clearLayers();});
  markerIndex={};
  getFilteredData().forEach(function(item){
    var cfg=typeConfig[item._type];
    var g=toG(item.lo,item.la);
    var m=L.circleMarker([g[1],g[0]],{radius:7,fillColor:cfg.color,color:'#fff',weight:2,fillOpacity:.9})
      .bindPopup(buildPopupHtml(item),{maxWidth:280,closeButton:true});
    m.on('click',function(){highlightCard(item._type,item.n);});
    markerLayers[item._type].addLayer(m);
    markerIndex[item._type+'|'+item.n]=m;
  });
}

function highlightCard(type,name){
  document.querySelectorAll('.item-card').forEach(function(c){c.classList.remove('active');});
  var card=document.querySelector('.item-card[data-type="'+type+'"][data-name="'+name+'"]');
  if(card){
    card.classList.add('active');
    card.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

// SELECT: card click -> fly + popup on map (map never covered)
function selectItem(type,name,fromCard){
  var item=allData.find(function(i){return i._type===type&&i.n===name;});
  if(!item)return;
  highlightCard(type,name);
  closeDrawer();
  if(currentView==='heat')setViewMode('marker');
  var g=toG(item.lo,item.la);
  map.flyTo([g[1],g[0]],Math.max(map.getZoom(),7),{duration:.7});
  var m=markerIndex[type+'|'+name];
  if(m){
    setTimeout(function(){m.openPopup();},fromCard?500:0);
  }
}

// DRAWER: full detail over LIST column only; close -> map popup remains
function openDrawer(type,name){
  var item=allData.find(function(i){return i._type===type&&i.n===name;});
  if(!item)return;
  var cfg=typeConfig[item._type];

  document.getElementById('drawerImg').src=item.img;
  document.getElementById('drawerName').textContent=item.n;
  document.getElementById('drawerMeta').innerHTML=
    gradeHtml(item)
    +'<span class="drawer-tag '+cfg.badge+'">'+cfg.label+'</span>'
    +'<span class="drawer-tag" style="background:#f0f4f8;color:#666">📍 '+item.p+'</span>'
    +(item.b?'<span class="drawer-tag" style="background:#f0f4f8;color:#666">📋 '+item.b+'</span>':'')
    +(item.t?'<span class="drawer-tag" style="background:#f0f4f8;color:#666">'+item.t+'</span>':'');
  document.getElementById('drawerDesc').textContent=item.d;

  var info='';
  if(item.g){
    info+='<div class="drawer-info-row"><span class="drawer-info-label">🏅 景区等级</span><span class="drawer-info-value">'+item.g+'级旅游景区</span></div>';
  }
  if(item.price){
    var unit=item.priceUnit?'/'+item.priceUnit:'';
    info+='<div class="drawer-info-row"><span class="drawer-info-label">💰 参考价格</span><span class="drawer-info-value">'+(item.price==='免费'?'免费开放':'¥'+item.price+unit)+'</span></div>';
  }
  if(item._type==='attraction'&&item.heat){
    info+='<div class="drawer-info-row"><span class="drawer-info-label">🔥 节假日热度</span><div class="item-heat" style="max-width:160px;flex:1"><div class="heat-track"><div class="heat-fill '+getHeatClass(item.heat)+'" style="width:'+item.heat+'%"></div></div><span class="heat-value">'+item.heat+'</span></div></div>';
  }
  info+='<div class="drawer-info-row"><span class="drawer-info-label">📍 坐标</span><span class="drawer-info-value">'+item.la.toFixed(2)+', '+item.lo.toFixed(2)+'</span></div>';
  document.getElementById('drawerInfo').innerHTML=info;

  var g=toG(item.lo,item.la);
  var amapLink='https://uri.amap.com/marker?position='+g[0]+','+g[1]+'&name='+encodeURIComponent(item.n);
  var ctripLink=item.link||'https://www.ctrip.com';
  var mafengwoLink='https://www.mafengwo.cn/search/q.php?q='+encodeURIComponent(item.n);
  document.getElementById('drawerLinks').innerHTML=
    '<a class="d-primary" href="'+amapLink+'" target="_blank">🗺 高德导航</a>'
    +'<a class="d-secondary" href="'+ctripLink+'" target="_blank">🎫 携程预订</a>'
    +'<a class="d-secondary" href="'+mafengwoLink+'" target="_blank">📖 马蜂窝攻略</a>';

  var region=item.r;
  var features=regionFeatures[region]?regionFeatures[region].features:[];
  var sameRegion=allData.filter(function(i){return i.r===region&&i._type!==item._type;}).slice(0,5);
  document.getElementById('drawerRegion').innerHTML=
    '<div class="drawer-region-title">📍 '+region+'特色</div>'
    +'<div class="drawer-region-tags">'+features.map(function(f){return '<span class="drawer-region-tag">'+f+'</span>';}).join('')+'</div>'
    +(sameRegion.length>0?'<div style="margin-top:10px;font-size:12px;color:#888">同地区：'+sameRegion.map(function(i){return i.n;}).join('、')+'</div>':'');

  document.getElementById('drawer').classList.add('show');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('show');
}

// FILTERS
function filterByType(type){
  currentType=type;
  document.querySelectorAll('.cat-tab').forEach(function(t){t.classList.toggle('active',t.dataset.type===type);});
  document.querySelectorAll('.map-tab').forEach(function(t){t.classList.toggle('active',t.dataset.layer===type);});
  closeDrawer();
  renderItems();
  renderMapMarkers();
  if(currentView==='heat')showHeatLayer();
}

function filterByRegion(region){
  currentRegion=region;
  document.querySelectorAll('.region-btn').forEach(function(b){b.classList.toggle('active',b.dataset.region===region);});
  closeDrawer();
  renderItems();
  renderMapMarkers();
  if(currentView==='heat')showHeatLayer();
  if(region!=='all'){
    var pts=getFilteredData().map(function(i){var g=toG(i.lo,i.la);return[g[1],g[0]];});
    if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:7});
  }
}

// INIT
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('navToggle').addEventListener('click',function(){
    document.getElementById('navMenu').classList.toggle('show');
  });
  document.getElementById('drawerClose').addEventListener('click',function(){
    closeDrawer();
  });

  document.querySelectorAll('.cat-tab').forEach(function(tab){
    tab.addEventListener('click',function(){filterByType(this.dataset.type);});
  });
  document.querySelectorAll('.region-btn').forEach(function(btn){
    btn.addEventListener('click',function(){filterByRegion(this.dataset.region);});
  });
  document.querySelectorAll('.map-tab').forEach(function(tab){
    tab.addEventListener('click',function(){filterByType(this.dataset.layer==='all'?'all':this.dataset.layer);});
  });
  document.querySelectorAll('.view-btn').forEach(function(btn){
    btn.addEventListener('click',function(){setViewMode(this.dataset.view);});
  });

  loadHolidays();

  Promise.all([
    fetch('data/resorts.json').then(function(r){return r.json();}),
    fetch('data/attractions.json').then(function(r){return r.json();}),
    fetch('data/hotels.json').then(function(r){return r.json();}),
    fetch('data/regions.json').then(function(r){return r.json();})
  ]).then(function(data){
    resorts=data[0].map(function(i){i._type='resort';return i;});
    attractions=data[1].map(function(i){i._type='attraction';return i;});
    hotels=data[2].map(function(i){i._type='hotel';return i;});
    var regions=data[3];
    Object.keys(regions).forEach(function(r){regionFeatures[r]=regions[r];});
    allData=resorts.concat(attractions,hotels);

    document.querySelector('[data-type="all"]').textContent='全部 ('+allData.length+')';
    document.querySelector('[data-type="resort"]').textContent='🏖 度假区 ('+resorts.length+')';
    document.querySelector('[data-type="attraction"]').textContent='⭐ 景点 ('+attractions.length+')';
    document.querySelector('[data-type="hotel"]').textContent='🏨 亲子 ('+hotels.length+')';

    renderItems();
    renderMapMarkers();
    if(currentView==='heat')showHeatLayer();
    setTimeout(function(){map.invalidateSize();},200);
  }).catch(function(err){
    console.error('加载失败:',err);
    document.getElementById('itemsList').innerHTML='<div class="empty" style="color:#e74c3c">数据加载失败，请刷新重试</div>';
  });
});
</script>
</body>
</html>
