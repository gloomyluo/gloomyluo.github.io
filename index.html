<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlooMy's Blog</title>
<style>
:root{--primary:#1a3a5c;--accent:#2d6a9f;--bg:#f5f7fa;--card:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei','PingFang SC',sans-serif;background:var(--bg);color:#333;min-height:100vh;display:flex;flex-direction:column}

.hero{background:linear-gradient(135deg,#1a3a5c,#2d6a9f);color:#fff;padding:60px 20px 50px;text-align:center}
.hero h1{font-size:32px;font-weight:700;letter-spacing:2px}
.hero p{font-size:14px;opacity:.7;margin-top:10px}

.container{max-width:900px;margin:0 auto;padding:30px 20px;flex:1}
.section-title{font-size:18px;color:var(--primary);margin-bottom:16px;padding-left:12px;border-left:3px solid var(--accent)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:40px}
.card{background:var(--card);border-radius:12px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:transform .2s,box-shadow .2s;text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.card-icon{font-size:36px;margin-bottom:12px}
.card h3{font-size:16px;color:var(--primary);margin-bottom:6px}
.card p{font-size:13px;color:#666;line-height:1.6}
.card .tag{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:12px;font-size:11px;background:#eef4fb;color:var(--accent)}

.empty{background:var(--card);border-radius:12px;padding:40px;text-align:center;color:#aaa;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.03);border:2px dashed #e0e0e0}

.footer{text-align:center;padding:20px;color:#bbb;font-size:12px;border-top:1px solid #eee}

@media(max-width:600px){
  .hero{padding:40px 16px 36px}
  .hero h1{font-size:24px}
  .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="hero">
  <h1>GlooMy's Blog</h1>
  <p>数据可视化 · 工具分享 · 生活记录</p>
</div>

<div class="container">
  <h2 class="section-title">数据可视化</h2>
  <div class="cards">
    <a class="card" href="travel/index.html">
      <div class="card-icon">🗺️</div>
      <h3>中国旅游全景地图</h3>
      <p>85家度假区 + 50个精选景点 + 20个亲子乐园，支持图层切换、地区导航、热力图展示。</p>
      <span class="tag">地图 · 155个项目</span>
    </a>
    <a class="card" href="hotel/index.html">
      <div class="card-icon">🏨</div>
      <h3>国庆酒店库存地图</h3>
      <p>7大集团149品牌5369家星级酒店，含类型标签、飞猪房价、城市筛选，支持缩放自动展开详情。</p>
      <span class="tag">地图 · 5369家酒店</span>
    </a>
    <div class="card" style="opacity:.5;cursor:default">
      <div class="card-icon">📊</div>
      <h3>更多可视化项目</h3>
      <p>敬请期待...</p>
      <span class="tag">即将上线</span>
    </div>
  </div>

  <h2 class="section-title">关于</h2>
  <div class="empty">
    这是一个个人博客，用于展示数据可视化作品和工具。<br>
    更多内容正在持续更新中。
  </div>
</div>

<div class="footer">
  © 2026 GlooMy · Powered by GitHub Pages
</div>

</body>
</html>
